name: Verify candidates

# Re-checks every current candidate against freshly downloaded TOI, CTOI,
# confirmed-planet and eclipsing-binary catalogs. Also runs after every hunt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tph verify
      - name: Commit
        run: |
          git config user.name "tess-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: verified candidates against fresh catalogs"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
