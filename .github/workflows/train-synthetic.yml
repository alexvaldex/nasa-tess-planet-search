name: Train vetter on simulations

# Generates thousands of realistic synthetic TESS light curves (planets, eclipsing
# binaries, blended binaries, systematics), runs the real pipeline on each, and
# trains the AI vetter on the results.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number of simulated light curves"
        default: "4000"

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tph train-synthetic --n "${{ github.event.inputs.n || '4000' }}"
      - run: python -m tph dashboard
      - name: Commit model
        run: |
          git config user.name "tess-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models data/synthetic_train.csv docs results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: retrained vetter on simulations"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
