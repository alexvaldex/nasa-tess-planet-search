name: Hunt for planets

# The autonomous bot. Every 6 hours it screens a fresh batch of TESS stars,
# commits the results, and refreshes the public dashboard. Free on public repos.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      n:
        description: "Number of new stars to screen"
        default: "800"
      hours:
        description: "Time budget in hours (max ~5.3)"
        default: "5"

permissions:
  contents: write
  actions: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Screen stars
        run: python -m tph hunt --n "${{ github.event.inputs.n || '800' }}" --hours "${{ github.event.inputs.hours || '5' }}"
      - name: Double-check candidates against fresh catalogs
        if: always()
        run: python -m tph verify || true
      - name: Commit results
        if: always()
        run: |
          python -m tph dashboard || true
          git config user.name "tess-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs models data/*.csv || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "bot: screened batch $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
      - name: Queue the next run
        # GitHub's cron can be late or skipped on busy days, so each run queues the
        # next one. It steps aside if anything else (like a retrain) is waiting.
        # To pause Tess: Actions tab -> "Hunt for planets" -> Disable workflow.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" --limit 20 --json status,workflowName --jq '[.[]|select(.workflowName!="pages build and deployment" and .workflowName!="Tests")|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length')
          if [ "$waiting" = "0" ]; then gh workflow run hunt.yml -R "$GITHUB_REPOSITORY" --ref main && echo "next run queued"; else echo "another run is waiting; skipping"; fi
