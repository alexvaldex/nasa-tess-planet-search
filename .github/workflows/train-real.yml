name: Train vetter on real TESS planets

# Runs the blind search on known TESS planets and known false positives,
# measures how many real planets the pipeline recovers, and retrains the AI vetter.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "TOIs per class (planets / false positives)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate and retrain
        run: python -m tph train-real --n "${{ github.event.inputs.n || '300' }}" --hours 5
      - name: Commit model
        if: always()
        run: |
          git config user.name "tess-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models results docs data/real_train.csv || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: retrained vetter on real TOIs"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
