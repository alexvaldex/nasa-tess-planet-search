name: Retrain everything

# Regenerates the simulated training set, then validates on (and learns from) real
# TESS planets and false positives. Use after changing the vetting features.
on:
  workflow_dispatch:
    inputs:
      sims:
        description: "Simulated light curves"
        default: "3000"
      real:
        description: "Real TOIs per class"
        default: "300"

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Simulations
        run: python -m tph train-synthetic --n "${{ github.event.inputs.sims || '3000' }}"
      - name: Real TESS planets and false positives
        run: python -m tph train-real --n "${{ github.event.inputs.real || '300' }}" --hours 3
      - name: Commit
        if: always()
        run: |
          python -m tph dashboard || true
          git config user.name "tess-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models results docs data/*.csv || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: retrained vetter (simulations + real TOIs)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
